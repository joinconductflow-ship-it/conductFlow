<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Transcript</title>
    <style>
      /* Same palette and scale as app/globals.css (dark theme), so the extension reads as
         part of ConductFlow rather than a generic browser-extension popup. */
      :root {
        color-scheme: dark;
        --canvas: #0A0A0B;
        --surface: #131316;
        --raised: #1A1A20;
        --raised-hover: #22222A;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #EDEDEF;
        --muted: #9A9AA5;
        --faint: #868692;
        --accent: #5B5EF0;
        --accent-hover: #6C6FF3;
        --danger: #E5484D;
        --danger-text: #FF6B70;
        --danger-quiet: rgba(229, 72, 77, 0.10);
        --radius: 6px;
        --radius-lg: 8px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Rounds the popup window's own corners — Chrome respects a border-radius on html/body
         in an extension popup as long as overflow is hidden to clip the corner pixels. */
      html {
        border-radius: 12px;
        overflow: hidden;
      }

      body {
        box-sizing: border-box;
        width: 360px;
        min-height: 430px;
        margin: 0;
        padding: 18px;
        color: var(--text);
        background: var(--canvas);
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        color: var(--text);
      }

      .privacy {
        margin: 0 0 14px;
        color: var(--faint);
        font-size: 12px;
      }

      .status {
        min-height: 18px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .status[data-kind="error"] {
        color: var(--danger-text);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        border: 1px solid transparent;
        border-radius: var(--radius-lg);
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: background 120ms ease;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      #start {
        color: var(--text);
        background: var(--accent);
      }

      #start:not(:disabled):hover {
        background: var(--accent-hover);
      }

      #stop {
        color: var(--danger-text);
        background: var(--danger-quiet);
        border-color: rgba(229, 72, 77, 0.34);
      }

      #transcript {
        box-sizing: border-box;
        width: 100%;
        height: 250px;
        resize: none;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 10px;
        color: var(--text);
        background: var(--surface);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #suggestions {
        margin-bottom: 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 10px;
        background: var(--surface);
      }

      #suggestions h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: var(--text);
      }

      #suggestion-list {
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
        line-height: 1.4;
        color: var(--text);
      }

      #suggestion-empty {
        margin: 0;
        color: var(--faint);
        font-size: 12px;
      }

      #copy, #send-now {
        width: 100%;
        margin-top: 8px;
        color: var(--text);
        background: var(--raised);
        border-color: var(--border-strong);
      }

      #copy:not(:disabled):hover, #send-now:not(:disabled):hover {
        background: var(--raised-hover);
      }

      details#setup {
        margin-bottom: 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        padding: 8px 10px;
        background: var(--surface);
      }

      details#setup summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
      }

      .setup-field {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--faint);
      }

      .setup-field input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 3px;
        padding: 6px 8px;
        font: 12px ui-sans-serif, system-ui, sans-serif;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
      }

      .setup-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        font-size: 11px;
        color: var(--faint);
      }

      #save-settings {
        margin-top: 10px;
        width: 100%;
        color: var(--text);
        background: var(--raised);
        border-color: var(--border-strong);
      }
      #save-settings:hover {
        background: var(--raised-hover);
      }

      #view-queue {
        display: block;
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 650;
        color: var(--accent-hover);
        text-decoration: none;
      }

      #view-queue:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Meeting Transcript</h1>
    <p class="privacy">Tab audio stays on this device. The speech model runs in Chrome.</p>
    <p id="connected-as" class="privacy" hidden></p>
    <details id="setup">
      <summary>Setup: send transcripts to ConductFlow automatically</summary>
      <details id="manual-setup" open>
        <summary>Use a different token instead</summary>
      <label class="setup-field">Workspace token (from Settings &rarr; Desktop app)
        <input id="token" type="password" autocomplete="off" placeholder="cfd_…" />
      </label>
      <label class="setup-field">Client name
        <input id="client-name" type="text" autocomplete="off" placeholder="e.g. Priya Sharma" />
      </label>
      <label class="setup-field">Client email
        <input id="client-email" type="email" autocomplete="off" placeholder="client@example.com" />
      </label>
      </details>
      <label class="setup-row">
        <input id="auto-send" type="checkbox" />
        Send automatically when I stop capturing
      </label>
      <button id="save-settings" type="button">Save setup</button>
    </details>
    <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
    <div class="controls">
      <button id="start" type="button">Start capturing this tab</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <div id="suggestions" aria-live="polite">
      <h2>Things to ask</h2>
      <ul id="suggestion-list" hidden></ul>
      <p id="suggestion-empty">No suggestions yet.</p>
    </div>
    <textarea id="transcript" readonly aria-label="Running transcript" placeholder="Transcript chunks will appear here…"></textarea>
    <button id="copy" type="button" disabled>Copy transcript</button>
    <button id="send-now" type="button" disabled>Send to ConductFlow</button>
    <a id="view-queue" href="#" target="_blank" rel="noopener" hidden>View in ConductFlow's queue &rarr;</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
