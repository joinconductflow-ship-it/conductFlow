<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Transcript</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 360px;
        min-height: 430px;
        margin: 0;
        padding: 18px;
        color: #172033;
        background: #f6f8fc;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }

      .privacy {
        margin: 0 0 14px;
        color: #526078;
        font-size: 12px;
      }

      .status {
        min-height: 18px;
        margin-bottom: 12px;
        color: #35415a;
        font-size: 12px;
      }

      .status[data-kind="error"] {
        color: #a11f2c;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-bottom: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      #start {
        color: white;
        background: #3157d5;
      }

      #stop {
        color: #8f1c2b;
        background: #f7dfe3;
      }

      #transcript {
        box-sizing: border-box;
        width: 100%;
        height: 250px;
        resize: none;
        border: 1px solid #ccd3df;
        border-radius: 8px;
        padding: 10px;
        color: #172033;
        background: white;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #suggestions {
        margin-bottom: 12px;
        border: 1px solid #ccd3df;
        border-radius: 8px;
        padding: 10px;
        background: white;
      }

      #suggestions h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      #suggestion-list {
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
        line-height: 1.4;
      }

      #suggestion-empty {
        margin: 0;
        color: #526078;
        font-size: 12px;
      }

      #copy {
        width: 100%;
        margin-top: 8px;
        color: #253148;
        background: #e6eaf2;
      }
    </style>
  </head>
  <body>
    <h1>Meeting Transcript</h1>
    <p class="privacy">Tab audio stays on this device. The speech model runs in Chrome.</p>
    <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
    <div class="controls">
      <button id="start" type="button">Start capturing this tab</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <div id="suggestions" aria-live="polite">
      <h2>Things to ask</h2>
      <ul id="suggestion-list" hidden></ul>
      <p id="suggestion-empty">No suggestions yet.</p>
    </div>
    <textarea id="transcript" readonly aria-label="Running transcript" placeholder="Transcript chunks will appear here…"></textarea>
    <button id="copy" type="button" disabled>Copy transcript</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
